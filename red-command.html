      (n, me, p) => ['پیشنهاد عدم تجاوز', `دولت ${n} آماده است پیمان عدم تجاوز با ${me} امضا کند. پاسخ شما برای ما مهم است.`],
      (n, me, p) => ['پیشنهاد همکاری نظامی', `${n} خواستار رزمایش مشترک و تبادل اطلاعات دفاعی با ${me} است. به نظر ما این همکاری به نفع هر دو طرف است.`]
    ],
    warning: [
      (n, me, p) => ['هشدار مرزی', `ارتش ${n} رزمایش‌های گسترده‌ای را آغاز کرده است. از هرگونه اقدام تحریک‌آمیز در نزدیکی مرزهای ما خودداری کنید.`],
      (n, me, p) => ['هشدار اقتصادی', `${n} نسبت به سیاست‌های اقتصادی ${me} ابراز نگرانی می‌کند و در صورت ادامه، محدودیت‌های تجاری اعمال خواهد کرد.`],
      (n, me, p) => ['هشدار دیپلماتیک', `فرمانده ${p}، لحن و رفتار شما زیر نظر ماست. صبر ${n} نیز حدی دارد.`]
    ],
    threat: [
      (n, me, p) => ['تهدید رسمی', `${n} به ${me} هشدار می‌دهد: ضعف شما بر کسی پوشیده نیست. اگر مسیر خود را اصلاح نکنید، پاسخ قاطعی خواهید دید.`],
      (n, me, p) => ['ضرب‌الاجل', `دولت ${n} به ${me} مهلت می‌دهد وضعیت خود را روشن کند، وگرنه نیروهای ما وارد عمل می‌شوند.`],
      (n, me, p) => ['اولتیماتوم', `${p}! ${n} دیگر تحمل نمی‌کند. از این به بعد هر قدمتان را زیر نظر داریم.`]
    ],
    praise: [
      (n, me, p) => ['تحسین قدرت نظامی', `ارتش ${me} مورد توجه ${n} قرار گرفته است. قدرت شما را می‌ستاییم و امیدواریم در مسیر صلح از آن استفاده کنید.`],
      (n, me, p) => ['تحسین اقتصاد', `رشد اقتصادی ${me} چشمگیر است. ${n} مایل است از تجربه‌ی شما بیاموزد.`]
    ]
  },

  // پاسخ‌های سریع بازیکن
  REPLY_OPTS: {
    friendly: [['thanks', '🤝 تشکر و همکاری'], ['ignore', '😐 بی‌تفاوتی']],
    offer:    [['accept', '✅ می‌پذیرم'], ['reject', '❌ رد می‌کنم']],
    warning:  [['counter', '🛡️ هشدار متقابل'], ['apologize', '🕊️ عذرخواهی']],
    threat:   [['counter', '🛡️ هشدار متقابل'], ['apologize', '🕊️ عذرخواهی']],
    condemn:  [['counter', '🛡️ هشدار متقابل'], ['apologize', '🕊️ عذرخواهی']],
    praise:   [['thanks', '🙏 ممنون']]
  },

  FOLLOW: {
    thanks:    (n, me, p) => ['friendly', 'پاسخ به پیام شما', `از پاسخ مثبت شما سپاسگزاریم. ${n} به همکاری با ${me} متعهد می‌ماند.`],
    ignore:    (n, me, p) => ['warning', 'سکوت شما را دیدیم', `بی‌توجهی ${me} به پیام ما پنهان نماند. امیدواریم ادامه پیدا نکند.`],
    accept:    (n, me, p) => ['friendly', 'توافق نهایی', `پیشنهاد پذیرفته شد! ${n} و ${me} از امروز شریک راهبردی هستند.`],
    reject:    (n, me, p) => ['warning', 'رد پیشنهاد', `رد پیشنهاد ما را به یاد خواهیم داشت. دیپلماسی هنوز تمام نشده است، ${p}.`],
    counter:   (n, me, p) => ['threat', 'پاسخ به هشدار شما', `هشدار شما را شنیدیم؛ ${n} عقب‌نشینی نخواهد کرد. حساب‌شده قدم بردارید.`],
    fear:      (n, me, p) => ['friendly', 'عقب‌نشینی', `${n} ترجیح می‌دهد وارد درگیری نشود و از موضع خود عقب می‌نشیند.`],
    apologize: (n, me, p) => ['friendly', 'عذرخواهی پذیرفته شد', `عذرخواهی ${me} را می‌پذیریم، اما انتظار داریم تکرار نشود.`]
  },

  esc(t) {
    return String(t).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  },
  pick(arr) { return arr[Math.floor(Math.random() * arr.length)]; },
  key() { return 'tw_statements_' + (App.account?.id || 'x'); },
  load() { return DB.get(this.key()) || []; },
  save(list) { DB.set(this.key(), list.slice(0, 60)); },

  names() {
    const mc = COUNTRIES.find(x => x.id === App.myCountry?.country_id);
    return { me: mc ? mc.name : 'کشور شما', p: this.esc(App.account?.player_name || 'فرمانده') };
  },

  pickSender(exclude = []) {
    const mine = App.myCountry?.country_id;
    const pool = COUNTRIES.filter(c => c.id !== mine && !exclude.includes(c.id));
    return this.pick(pool);
  },

  isActiveTab() {
    return document.getElementById('tab-statements')?.classList.contains('active');
  },

  add(st, notify = true) {
    const list = this.load();
    list.unshift({ id: 'st_' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6), ts: Date.now(), read: false, ...st });
    this.save(list);
    this.updateBadge();
    if (notify) Sfx.play('msg');
    if (this.isActiveTab()) this.render();
    else if (notify) App.toast(`📢 بیانیه‌ی جدید از ${st.flag} ${st.sender}`);
  },

  fromTemplate(type, sender, notify = true) {
    const { me, p } = this.names();
    const [title, body] = this.pick(this.T[type])(sender.name, me, p);
    this.add({ type, country_id: sender.id, flag: sender.flag, sender: sender.name, title, body }, notify);
  },

  // اولین پیام‌های خوشامدگویی
  welcome() {
    if (!App.myCountry || this.load().length) return;
    const a = this.pickSender();
    const b = this.pickSender([a.id]);
    this.fromTemplate('friendly', a, false);
    this.fromTemplate('offer', b, false);
    this.updateBadge();
  },

  // انتخاب نوع پیام بر اساس وضعیت شما
  generate() {
    const c = App.myCountry;
    if (!c) return;
    const power = Battle.calcAttackPower(c.inventory || {}).total;
    const weak = (c.hp || 0) < (c.max_hp || 1000);
    const w = { friendly: 3, offer: 2, warning: 2, threat: weak ? 4 : 1, praise: ((c.cash || 0) > 150000 || power > 20) ? 3 : 0 };
    let r = Math.random() * Object.values(w).reduce((a, b) => a + b, 0);
    let type = 'friendly';
    for (const [k, v] of Object.entries(w)) { if ((r -= v) < 0) { type = k; break; } }
    this.fromTemplate(type, this.pickSender());
  },

  tick() {
    if (!App.myCountry) return;
    const now = Date.now();
    if (!this._next) this._next = now + 30000 + Math.random() * 60000;
    if (now < this._next) return;
    this._next = now + 90000 + Math.random() * 120000;
    this.generate();
  },

  // واکنش کشورها به حمله شما
  onAttack(targetId, result) {
    const target = COUNTRIES.find(x => x.id === targetId);
    if (!target) return;
    const { me, p } = this.names();
    setTimeout(() => {
      const body = result === 'repelled'
        ? `${p}، حمله‌ی شما به ${target.name} با شکست روبه‌رو شد. ما ${target.name} را رها نمی‌کنیم و پاسخ این تجاوز را می‌دهیم.`
        : `حمله‌ی ${me} به ${target.name} را قاطعانه محکوم می‌کنیم. این تجاوز بی‌پاسخ نخواهد ماند.`;
      this.add({ type: 'condemn', country_id: target.id, flag: target.flag, sender: target.name, title: 'محکومیت حمله', body });
    }, 2500);
    setTimeout(() => {
      const s = this.pickSender([targetId]);
      const calm = Math.random() < 0.5;
      this.add(calm
        ? { type: 'warning', country_id: s.id, flag: s.flag, sender: s.name, title: 'نگرانی جهانی', body: `${s.name} نسبت به حمله‌ی ${me} به ${target.name} ابراز نگرانی می‌کند و خواستار توقف درگیری است.` }
        : { type: 'friendly', country_id: s.id, flag: s.flag, sender: s.name, title: 'پیام احترام', body: `${s.name} از قدرت ${me} آگاه است و ترجیح می‌دهد با شما در صلح باشد.`, no_reply: true });
    }, 6000);
  },

  onSanction() {
    const { me } = this.names();
    setTimeout(() => this.add({ type: 'un', country_id: 'un', flag: '🇺🇳', sender: 'سازمان ملل', title: 'اعلام تحریم', body: `به دلیل اقدام نظامی بدون دلیل موجه، ${me} به مدت ۲۴ ساعت تحت تحریم قرار گرفت و درآمد آن ۳۰٪ کاهش می‌یابد.`, no_reply: true }), 1200);
  },

  OUT_TYPES: [['friendly', '🤝 دوستانه'], ['offer', '📜 پیشنهاد'], ['warning', '⚠️ هشدار'], ['threat', '🔥 تهدید']],
  OUT_DEFAULT: {
    friendly: (n, me) => `${me} ضمن احترام به ${n}، آمادگی خود را برای همکاری و گسترش روابط اعلام می‌کند.`,
    offer:    (n, me) => `${me} به ${n} پیشنهاد پیمان تجاری و عدم تجاوز می‌دهد. منتظر پاسخ شما هستیم.`,
    warning:  (n, me) => `${me} به ${n} هشدار می‌دهد از هرگونه اقدام تحریک‌آمیز خودداری کند.`,
    threat:   (n, me) => `${me} به ${n} اعلام می‌کند: اگر مسیر خود را اصلاح نکنید، پاسخ قاطعی خواهید دید.`
  },

  composeHtml() {
    const mine = App.myCountry?.country_id;
    const opts = COUNTRIES.filter(c => c.id !== mine).map(c => `<option value="${c.id}">${c.flag} ${c.name}</option>`).join('');
    const types = this.OUT_TYPES.map(t => `<option value="${t[0]}">${t[1]}</option>`).join('');
    return `<div class="card st-compose"><h3>✍️ صدور بیانیه</h3>
      <div class="st-form">
        <select id="st-target">${opts}</select>
        <select id="st-type">${types}</select>
        <textarea id="st-text" maxlength="200" rows="2" placeholder="متن بیانیه (اختیاری؛ خالی بگذارید تا متن آماده ارسال شود)"></textarea>
        <button class="btn primary" onclick="Statements.send()">📤 ارسال بیانیه</button>
      </div></div>`;
  },

  send() {
    const id = document.getElementById('st-target')?.value;
    const type = document.getElementById('st-type')?.value;
    const target = COUNTRIES.find(c => c.id === id);
    if (!target || !this.OUT_DEFAULT[type]) return;
    const { me, p } = this.names();
    const custom = (document.getElementById('st-text')?.value || '').trim();
    const body = custom ? this.esc(custom) : this.OUT_DEFAULT[type](target.name, me);
    const label = this.OUT_TYPES.find(t => t[0] === type)[1].replace(/^\S+\s/, '');
    const box = document.getElementById('st-text'); if (box) box.value = '';
    this.add({ type, out: true, read: true, no_reply: true, country_id: target.id, flag: target.flag, sender: target.name, title: 'بیانیه‌ی شما (' + label + ')', body }, false);
    Sfx.play('msg');
    const power = Battle.calcAttackPower(App.myCountry.inventory || {}).total;
    const r = Math.random();
    const key = type === 'friendly' ? (r < .8 ? 'thanks' : 'ignore')
      : type === 'offer' ? (r < .6 ? 'accept' : 'reject')
      : (r < (power > 20 ? .65 : .35) ? 'fear' : 'counter');
    setTimeout(() => {
      const [t2, title, text] = this.FOLLOW[key](target.name, me, p);
      this.add({ type: t2, country_id: target.id, flag: target.flag, sender: target.name, title, body: text, no_reply: true });
    }, 2500 + Math.random() * 2000);
  },

  reply(id, optId) {
    const list = this.load();
    const st = list.find(x => x.id === id);
    if (!st || st.replied) return;
    const opt = (this.REPLY_OPTS[st.type] || []).find(o => o[0] === optId);
    if (!opt) return;
    st.replied = opt[1];
    this.save(list);
    Missions.track('reply');
    this.render();
    const { me, p } = this.names();
    setTimeout(() => {
      const [type, title, body] = this.FOLLOW[optId](st.sender, me, p);
      this.add({ type, country_id: st.country_id, flag: st.flag, sender: st.sender, title, body, no_reply: true });
    }, 2500);
  },

  // ----- صدور بیانیه توسط شما -----
  _draft: { target: 'all', type: 'friendly', text: '' },
  OUT: {
    friendly: ['پیام دوستی', (me, t) => `${me} با احترام به ${t} اعلام می‌کند که خواهان روابط دوستانه و همکاری دوجانبه است.`],
    offer:    ['پیشنهاد همکاری', (me, t) => `${me} به ${t} پیشنهاد پیمان تجاری و عدم تجاوز می‌دهد.`],
    warning:  ['هشدار رسمی', (me, t) => `${me} به ${t} هشدار می‌دهد که از اقدامات تحریک‌آمیز خودداری کند.`],
    threat:   ['تهدید رسمی', (me, t) => `${me} به ${t} اعلام می‌کند: در صورت ادامه‌ی این رفتار، پاسخ نظامی قاطعی خواهد بود.`]
  },
  respond(type, n, me) {
    const r = Math.random();
    if (type === 'friendly') return r < .7 ? ['friendly', 'پاسخ به بیانیه شما', `${n} از بیانیه‌ی ${me} استقبال می‌کند و آماده‌ی گفت‌وگوست.`] : ['warning', 'بی‌اعتمادی', `${n} بیانیه‌ی شما را شنید، اما اعتماد با حرف ساخته نمی‌شود.`];
    if (type === 'offer') return r < .55 ? ['friendly', 'پیشنهاد پذیرفته شد', `${n} پیشنهاد ${me} را می‌پذیرد. همکاری ما از امروز آغاز می‌شود.`] : ['warning', 'پیشنهاد رد شد', `${n} پیشنهاد شما را در شرایط فعلی نمی‌پذیرد.`];
    if (type === 'warning') return r < .5 ? ['threat', 'پاسخ به هشدار', `${n} هشدار شما را رد می‌کند و عقب‌نشینی نخواهد کرد.`] : ['friendly', 'کاهش تنش', `${n} ضمن ابراز نگرانی، آمادگی خود را برای کاهش تنش اعلام می‌کند.`];
    return r < .6 ? ['threat', 'تهدید متقابل', `${n} تهدید ${me} را بی‌پاسخ نمی‌گذارد؛ نیروهای ما آماده‌اند.`] : ['warning', 'نگرانی از تنش', `${n} از لحن تند ${me} نگران است و خواستار خویشتنداری شد.`];
  },
  setType(t) { this._draft.type = t; this.render(); },
  send() {
    const d = this._draft, { me } = this.names();
    const mine = App.myCountry?.country_id;
    const isAll = d.target === 'all';
    const target = isAll ? { id: 'all', name: 'همه کشورها', flag: '🌍' } : COUNTRIES.find(c => c.id === d.target);
    if (!target || target.id === mine) return alert('یک کشور مقصد انتخاب کنید');
    const [title, def] = this.OUT[d.type];
    const custom = (d.text || '').trim();
    const body = custom ? this.esc(custom).replace(/\n/g, '<br>') : def(me, isAll ? 'جامعه‌ی جهانی' : target.name);
    const list = this.load();
    list.unshift({ id: 'st_' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6), ts: Date.now(), read: true, type: d.type, country_id: target.id, flag: target.flag, sender: 'شما', to: target.name, mine: true, no_reply: true, title, body });
    this.save(list);
    Sfx.play('msg');
    d.text = '';
    // پاسخ کشورها
    const pool = isAll ? COUNTRIES.filter(c => c.id !== mine).sort(() => Math.random() - .5).slice(0, 3) : [target];
    pool.forEach((c, i) => setTimeout(() => {
      const [type, t2, b2] = this.respond(d.type, c.name, me);
      this.add({ type, country_id: c.id, flag: c.flag, sender: c.name, title: t2, body: b2, no_reply: true });
    }, 2500 + i * 2500));
    this.render();
  },
  composeHtml() {
    const d = this._draft, mine = App.myCountry?.country_id;
    const opts = '<option value="all">🌍 همه کشورها</option>' + COUNTRIES.filter(c => c.id !== mine)
      .map(c => `<option value="${c.id}" ${d.target === c.id ? 'selected' : ''}>${c.flag} ${c.name}</option>`).join('');
    const types = Object.entries({ friendly: '🤝 دوستانه', offer: '📜 پیشنهاد', warning: '⚠️ هشدار', threat: '🔥 تهدید' })
      .map(([k, l]) => `<button class="${d.type === k ? 'on' : ''}" onclick="Statements.setType('${k}')">${l}</button>`).join('');
    return `<div class="card st-compose"><h3>✍️ صدور بیانیه</h3>
      <select onchange="Statements._draft.target=this.value">${opts}</select>
      <div class="st-types">${types}</div>
      <textarea maxlength="300" placeholder="متن بیانیه (اختیاری؛ اگر خالی بماند متن آماده ارسال می‌شود)" oninput="Statements._draft.text=this.value">${this.esc(d.text || '')}</textarea>
      <button class="btn primary" onclick="Statements.send()">📤 صدور بیانیه</button></div>`;
  },

  clear() {
    if (!confirm('همه‌ی بیانیه‌ها پاک شوند؟')) return;
    this.save([]);
    this.render();
    this.updateBadge();
  },

  unreadCount() { return this.load().filter(x => !x.read).length; },

  updateBadge() {
    const n = App.account ? this.unreadCount() : 0;
    document.querySelectorAll('.stmt-badge').forEach(el => {
      el.textContent = n > 9 ? '9+' : n;
      el.classList.toggle('show', n > 0);
    });
  },

  ago(ts) {
    const s = Math.floor((Date.now() - ts) / 1000);
    if (s < 60) return 'چند لحظه پیش';
    if (s < 3600) return Math.floor(s / 60).toLocaleString('fa-IR') + ' دقیقه پیش';
    if (s < 86400) return Math.floor(s / 3600).toLocaleString('fa-IR') + ' ساعت پیش';
    return Math.floor(s / 86400).toLocaleString('fa-IR') + ' روز پیش';
  },

  render() {
    const el = document.getElementById('tab-statements');
    if (!el) return;
    const list = this.load();
    const keep = ['st-target', 'st-type', 'st-text'].map(i => document.getElementById(i)?.value);
    const cards = list.map(st => {
      const m = this.META[st.type] || this.META.friendly;
      if (st.out) {
        return `<div class="st-card st-out"><div class="st-flag">${Flag.img(st.country_id, st.flag)}</div>
          <div class="st-body"><div class="st-head"><span class="st-name">شما ← ${st.sender}</span>
          <span class="st-type ${m.cls}">${m.label}</span><span class="st-time">${this.ago(st.ts)}</span></div>
          <div class="st-text">${st.body}</div></div></div>`;
      }
      let actions = '';
      if (st.replied) {
        actions = `<div class="st-replied">پاسخ شما: ${st.replied}</div>`;
      } else if (!st.no_reply && this.REPLY_OPTS[st.type]) {
        actions = '<div class="st-replies">' + this.REPLY_OPTS[st.type].map(o =>
          `<button onclick="Statements.reply('${st.id}','${o[0]}')">${o[1]}</button>`).join('') + '</div>';
      }
      return `<div class="st-card ${st.read ? '' : 'unread'} ${st.mine ? 'mine' : ''}">
        <div class="st-flag">${Flag.img(st.country_id, st.flag)}</div>
        <div class="st-body">
          <div class="st-head">
            <span class="st-name">${st.mine ? 'شما ← ' + st.to : st.sender}</span>
            <span class="st-type ${m.cls}">${m.label}</span>
            <span class="st-time">${this.ago(st.ts)}</span>
          </div>
          <div class="st-title">${st.title}</div>
          <div class="st-text">${st.body}</div>
          ${actions}
        </div>
      </div>`;
    }).join('');
    el.innerHTML = `
      <div class="st-top">
        <h2>📢 بیانیه‌ها</h2>
        ${list.length ? '<button class="btn-sm" onclick="Statements.clear()">پاک کردن همه</button>' : ''}
      </div>
      ${this.composeHtml()}
      ${this.composeHtml()}
      ${cards || '<div class="card"><p class="muted" style="text-align:center">هنوز بیانیه‌ای از کشورها نرسیده است.<br>کمی صبر کنید؛ کشورها به‌زودی با شما صحبت می‌کنند.</p></div>'}
    `;
    ['st-target', 'st-type', 'st-text'].forEach((i, k) => { const e = document.getElementById(i); if (e && keep[k] != null) e.value = keep[k]; });
    let changed = false;
    list.forEach(x => { if (!x.read) { x.read = true; changed = true; } });
    if (changed) { this.save(list); this.updateBadge(); }
  }
};

// شروع
document.addEventListener('DOMContentLoaded', () => {
  if (!Auth.checkSession()) {
    document.getElementById('auth-screen').style.display = 'flex';
  }
});

</script>
<script id="github-loader-script">
(function(){function hide(){var el=document.getElementById('blue-loading-screen');if(!el)return;el.style.transition='opacity .45s ease';el.style.opacity='0';setTimeout(function(){el.remove()},500)}document.addEventListener('DOMContentLoaded',function(){setTimeout(hide,1500)});})();
</script>
